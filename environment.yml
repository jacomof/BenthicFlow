# Exported from the working env with: conda env export -n ocean2 --no-builds
# Create with:  mamba env create -f environment.yml
# NOTE: gsplat is intentionally NOT listed here -- it must be compiled
# against this env's torch (e.g. bash scripts/install_gsplat_local.sh or sbatch launch_scripts/setup/install_gsplat.sh)
name: ocean2
channels:
  - conda-forge
dependencies:
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2026.6.17
  - ld_impl_linux-64=2.45.1
  - libexpat=2.8.1
  - libffi=3.5.2
  - libgcc=15.2.0
  - libgcc-ng=15.2.0
  - libgomp=15.2.0
  - liblzma=5.8.3
  - libnsl=2.0.1
  - libsqlite=3.53.3
  - libuuid=2.42.2
  - libxcrypt=4.4.36
  - libzlib=1.3.2
  - ncurses=6.6
  - openssl=3.6.3
  - packaging=26.2
  - pip=26.1.2
  - python=3.12.13
  - readline=8.3
  - tk=8.6.13
  - tzdata=2025c
  - wheel=0.47.0
  - zstd=1.5.7
  - pip:
      # cu126 wheels (torch/torchvision) come from the PyTorch index:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      # Needed by REEF.reef_io / scripts/generate_3d.py; the original
      # data-prep env carried these, ocean2 did not -- included so one
